group = 'io.supy.scanner'
version = '0.1.0'

buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'io.supy.scanner'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    // CameraX — preview + lifecycle-bound controller. Detection (ML Kit) is
    // wired in S1-09 on top of these.
    def cameraxVersion = '1.3.4'
    implementation "androidx.camera:camera-core:$cameraxVersion"
    implementation "androidx.camera:camera-camera2:$cameraxVersion"
    implementation "androidx.camera:camera-lifecycle:$cameraxVersion"
    implementation "androidx.camera:camera-view:$cameraxVersion"

    implementation 'androidx.lifecycle:lifecycle-common:2.7.0'

    // ML Kit Barcode — on-device, no network, no license cost.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // GMS Document Scanner — on-device, model is downloaded on first use via
    // Google Play services. OCR runs separately via ML Kit Text Recognition.
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'

    // ML Kit Text Recognition v2 — Latin script (covers `en`). Arabic OCR is
    // NOT supported by ML Kit; see docs/MIGRATION.md for the Android coverage
    // caveat.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
