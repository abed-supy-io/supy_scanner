name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.22.3'

jobs:
  analyze-and-test:
    name: analyze + format + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get (library)
        run: flutter pub get

      - name: flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --set-exit-if-changed lib test example/lib

      - name: dart analyze
        run: dart analyze --fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

  build-android:
    name: build example (android)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: flutter build apk --debug
        working-directory: example
        run: flutter build apk --debug

  build-ios:
    name: build example (ios)
    runs-on: macos-14
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get (example)
        working-directory: example
        run: flutter pub get

      - name: flutter build ios --no-codesign
        working-directory: example
        run: flutter build ios --no-codesign
