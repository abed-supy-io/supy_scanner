name: supy_scanner
description: First-party Flutter scanning library for Supy — native-backed barcode and document scanner with drop-in Scanbot-compatible APIs.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.supy.scanner
        pluginClass: SupyScannerPlugin
      ios:
        pluginClass: SupyScannerPlugin
