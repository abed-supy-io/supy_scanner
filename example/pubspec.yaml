name: supy_scanner_example
description: Example app for supy_scanner. Doubles as the QA harness.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  image: ^4.9.1
  # Benchmark-only, example-app deps (never in the library `lib/`):
  #  - mobile_scanner: the free baseline we compare against.
  #  - barcode + barcode_image: pure-Dart fixture generation (rasterized via `image`).
  # All free/permissive; none is a paid third-party SDK.
  barcode: ^2.2.8
  barcode_image: ^2.0.3
  mobile_scanner: ^7.0.1
  supy_scanner:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
